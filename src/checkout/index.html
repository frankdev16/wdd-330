<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Secure checkout at SleepOutside. Complete your order for tents, backpacks, sleeping bags, and camping gear."
    />

    <title>Sleep Outside | Checkout</title>

    <link
      rel="stylesheet"
      href="/css/style.css"
      media="print"
      onload="this.media='all'"
    />

    <noscript><link rel="stylesheet" href="/css/style.css" /></noscript>
    <script type="module" src="/js/checkout.js"></script>
  </head>

  <body>
    <header class="divider" role="banner" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2 class="rnp">Review & Place your Order</h2>
      </section>

        
      <section class="order-summary" aria-label="Order summary">
        <h2>Order Summary</h2>
          <dl>
            <div class="summary-row">
              <dt>Subtotal</dt>
              <dd id="summarySubtotal">$0.00</dd>
            </div>
            <div class="summary-row">
              <dt>Tax</dt>
              <dd id="summaryTax">$0.00</dd>
            </div>
            <div class="summary-row">
              <dt>Shipping Estimate</dt>
              <dd id="summaryShipping">$0.00</dd>
            </div>
            <div class="summary-row summary-total">
              <dt>Order Total</dt>
              <dd id="summaryTotal">$0.00</dd>
            </div>
          </dl>
      </section>

      <section class="checkout-form">
        <form id="checkoutForm" novalidate>
          <h1>Checkout</h1>
          <p class="sub">Please fill in every field to complete your order.</p>

          <fieldset>
            <legend>Customer Name</legend>
            <div class="row">
              <div class="field">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" name="fname" required>
                <div class="error-msg"></div>
              </div>
              <div class="field">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" name="lname" required>
                <div class="error-msg"></div>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <div class="field">
              <label for="street">Street Address</label>
              <input type="text" id="street" name="street" required>
              <div class="error-msg"></div>
            </div>
            <div class="row">
              <div class="field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
                <div class="error-msg"></div>
              </div>
              <div class="field">
                <label for="state">State</label>
                <input type="text" id="state" name="state" required>
                <div class="error-msg"></div>
              </div>
              <div class="field">
                <label for="zip">Zip Code</label>
                <input type="text" id="zip" name="zip" inputmode="numeric" pattern="\d{5}(-\d{4})?" placeholder="12345" required>
                <div class="error-msg"></div>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <div class="field">
              <label for="cardNumber">Credit Card Number</label>
              <input type="text" id="cardNumber" name="cardNumber" inputmode="numeric" placeholder="1234 5678 9012 3456" pattern="[\d\s]{13,19}" required>
              <div class="error-msg"></div>
            </div>
            <div class="row">
              <div class="field">
                <label for="expDate">Expiration Date</label>
                <input type="text" id="expDate" name="expiration" placeholder="MM/YY" pattern="(0[1-9]|1[0-2])\/\d{2}" required>
                <div class="error-msg"></div>
              </div>
              <div class="field">
                <label for="cvv">Security Code</label>
                <input type="text" id="cvv" name="code" inputmode="numeric" placeholder="CVV" pattern="\d{3,4}" required>
                <div class="error-msg"></div>
              </div>
            </div>
          </fieldset>
          <button id="checkout-button">Checkout</button>
          <div id="formStatus" role="status"></div>

        </form>      
      </section>
      


    </main>

    <footer role="contentinfo" id="main-footer"></footer>
  </body>
</html>
